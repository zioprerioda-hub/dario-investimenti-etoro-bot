name: Native schedule heartbeat
# Re-register scheduler after repository visibility change to public.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-schedule-heartbeat.yml"
  schedule:
    # Minimal native GitHub timer test, every five minutes (UTC).
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Confirm native schedule event
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          date -u

      - name: Persist proof when scheduler fires
        if: github.event_name == 'schedule'
        run: |
          printf 'event=schedule\nrun_id=%s\nstarted_utc=%s\nsha=%s\n' \
            "$GITHUB_RUN_ID" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" \
            > native-schedule-last.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-schedule-last.txt
          git commit -m "chore: record native schedule heartbeat [skip ci]" || exit 0
          git pull --rebase origin main
          git push
