name: Telegram hello every 5 minutes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: telegram-hello-5min
  cancel-in-progress: false

jobs:
  send-hello:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send ciao to Telegram
        run: python telegram_hello.py
