name: Build Dama Qwen APK

on:
  push:
    branches:
      - chatgpt-dama-qwen-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Customize Dama Qwen
        run: |
          cp chatgpt/dama-qwen/MainActivity.kt llama.cpp/examples/llama.android/app/src/main/java/com/example/llama/MainActivity.kt
          cp chatgpt/dama-qwen/CheckersGame.kt llama.cpp/examples/llama.android/app/src/main/java/com/example/llama/CheckersGame.kt
          cp chatgpt/dama-qwen/AndroidManifest.xml llama.cpp/examples/llama.android/app/src/main/AndroidManifest.xml
          cp chatgpt/dama-qwen/strings.xml llama.cpp/examples/llama.android/app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.dario.damaqwen"/' llama.cpp/examples/llama.android/app/build.gradle.kts
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("arm64-v8a")/' llama.cpp/examples/llama.android/lib/build.gradle.kts

      - name: Build APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk DamaQwen-Honor-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DamaQwen-Honor-arm64
          path: DamaQwen-Honor-arm64.apk
          if-no-files-found: error
