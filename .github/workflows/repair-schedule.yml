name: Diagnose and re-enable report schedule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-schedule.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: repair-thomaspj-schedule
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect and re-register the existing report workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "report-schedule-repair",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(base + path, method=method, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          path = "/actions/workflows/monitor.yml"
          before = api(path)
          runs = api("/actions/runs?event=schedule&per_page=5")
          print("Checked at:", datetime.now(timezone.utc).isoformat())
          print("Workflow before:", json.dumps({
              key: before.get(key) for key in ("id", "name", "path", "state", "created_at", "updated_at")
          }))
          print("Scheduled runs before repair:", runs["total_count"])
          for run in runs.get("workflow_runs", []):
              print(json.dumps({key: run.get(key) for key in ("id", "created_at", "status", "conclusion")}))
          try:
              api(path + "/disable", "PUT")
              print("Disabled report workflow for re-registration.")
          finally:
              api(path + "/enable", "PUT")
          after = api(path)
          print("Workflow after:", json.dumps({
              key: after.get(key) for key in ("id", "name", "path", "state", "updated_at")
          }))
          if after["state"] != "active":
              raise RuntimeError("Report workflow is not active after repair")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Report schedule diagnostic\n\n")
              summary.write(f"- Previous state: {before['state']}\n")
              summary.write(f"- Scheduled runs recorded: {runs['total_count']}\n")
              summary.write("- Disabled and re-enabled the existing monitor.yml workflow.\n")
              summary.write("- Current state: active.\n")
              summary.write("- A future run with event schedule is still required to verify automatic delivery.\n")
          PY
