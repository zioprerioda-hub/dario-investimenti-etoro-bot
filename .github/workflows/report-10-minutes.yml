name: Report thomaspj manual fallback
run-name: "${{ github.event_name }} | thomaspj fallback report"

# Automatic scheduling moved to Supabase. GitHub remains available only as a manual fallback.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor-manual
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: "1"
      HTML_REPORT_MINUTES: "1"
      FORCE_HTML_REPORT: "true"
      FORCE_PORTFOLIO_SUMMARY: "true"
      REPORT_URL: ""
      REPORT_DIR: docs
      SEND_INITIAL_PORTFOLIO: "true"
      RISK_FREE_ANNUAL: "0"
      TREEMAP_HISTORY_HOURS: "12"
      TREEMAP_HISTORY_LIMIT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: pip install requests==2.32.5

      - name: Send one manual fallback report
        run: python scheduled_runner.py

      - name: Persist monitor and report history
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          for f in state.json html_report_state.json dashboard_state.json; do
            if [ -f "$f" ]; then cp "$f" "$tmpdir/$f"; fi
          done

          git fetch origin main || true
          git reset --hard origin/main || true

          for f in state.json html_report_state.json dashboard_state.json; do
            if [ -f "$tmpdir/$f" ]; then cp "$tmpdir/$f" "$f"; fi
          done

          git add state.json 2>/dev/null || true
          [ -f html_report_state.json ] && git add html_report_state.json
          [ -f dashboard_state.json ] && git add dashboard_state.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update thomaspj monitor state [skip ci]" || true
            git push origin HEAD:main || true
          fi

          exit 0
