name: Report thomaspj every minute
run-name: "${{ github.event_name }} | thomaspj report"

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions supports a minimum native schedule interval of 5 minutes.
    # Keep one runner alive for five cycles so Telegram receives one report per minute.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: "1"
      HTML_REPORT_MINUTES: "1"
      FORCE_HTML_REPORT: "true"
      FORCE_PORTFOLIO_SUMMARY: "true"
      REPORT_URL: ""
      REPORT_DIR: docs
      SEND_INITIAL_PORTFOLIO: "true"
      RISK_FREE_ANNUAL: "0"
      TREEMAP_HISTORY_HOURS: "12"
      TREEMAP_HISTORY_LIMIT: "20"
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: pip install requests==2.32.5

      - name: Show scheduler mode
        run: |
          echo "event=$EVENT_NAME"
          echo "schedule=${{ github.event.schedule }}"
          echo "FORCE_HTML_REPORT=$FORCE_HTML_REPORT"
          echo "FORCE_PORTFOLIO_SUMMARY=$FORCE_PORTFOLIO_SUMMARY"

      - name: Monitor eToro and deliver one report per minute
        shell: bash
        run: |
          # Do NOT use `set -e` here: one transient eToro/Telegram failure must
          # never terminate the remaining minute cycles.
          set +e

          # Always run five cycles. This also makes a manual test reproduce the
          # real scheduled behaviour instead of sending only one report.
          iterations=5
          successful_cycles=0
          failed_cycles=0

          for i in $(seq 1 "$iterations"); do
            cycle_start=$(date +%s)
            echo "===== Report cycle $i/$iterations at $(date -u +'%Y-%m-%dT%H:%M:%SZ') ====="

            # Retry the individual minute once for transient API/network errors.
            cycle_ok=0
            for attempt in 1 2; do
              echo "Cycle $i attempt $attempt/2"
              python scheduled_runner.py
              rc=$?

              if [ "$rc" -eq 0 ]; then
                cycle_ok=1
                successful_cycles=$((successful_cycles + 1))
                echo "Cycle $i delivered successfully."
                break
              fi

              echo "::warning::Cycle $i attempt $attempt failed with exit code $rc."
              if [ "$attempt" -lt 2 ]; then
                echo "Retrying this minute in 5 seconds..."
                sleep 5
              fi
            done

            if [ "$cycle_ok" -ne 1 ]; then
              failed_cycles=$((failed_cycles + 1))
              echo "::warning::Cycle $i failed after both attempts; continuing with the next minute."
            fi

            if [ "$i" -lt "$iterations" ]; then
              elapsed=$(( $(date +%s) - cycle_start ))
              sleep_for=$(( 60 - elapsed ))
              if [ "$sleep_for" -lt 1 ]; then
                sleep_for=1
              fi
              echo "Waiting ${sleep_for}s before the next report cycle..."
              sleep "$sleep_for"
            fi
          done

          echo "Minute-loop summary: successful=$successful_cycles failed=$failed_cycles"

          # The persistence step below must always run. Mark a warning rather
          # than aborting the job when only some minute cycles failed.
          if [ "$failed_cycles" -gt 0 ]; then
            echo "::warning::$failed_cycles of $iterations report cycles failed, but the loop completed."
          fi

          exit 0

      - name: Persist monitor and report history
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tmpdir="$(mktemp -d)"
          for f in state.json html_report_state.json dashboard_state.json; do
            if [ -f "$f" ]; then cp "$f" "$tmpdir/$f"; fi
          done

          persisted=0
          for attempt in 1 2 3; do
            echo "Persistence attempt $attempt"
            git fetch origin main || true
            git reset --hard origin/main || true

            for f in state.json html_report_state.json dashboard_state.json; do
              if [ -f "$tmpdir/$f" ]; then cp "$tmpdir/$f" "$f"; fi
            done

            git add state.json 2>/dev/null || true
            [ -f html_report_state.json ] && git add html_report_state.json
            [ -f dashboard_state.json ] && git add dashboard_state.json

            if git diff --cached --quiet; then
              echo "No state change to persist"
              persisted=1
              break
            fi

            git commit -m "chore: update thomaspj monitor state [skip ci]" || true
            if git push origin HEAD:main; then
              echo "State persisted successfully"
              persisted=1
              break
            fi

            sleep 2
          done

          if [ "$persisted" -ne 1 ]; then
            echo "::warning::Reports were delivered, but state persistence could not be pushed after 3 attempts."
          fi

          # Never mark report delivery failed only because state persistence raced with another commit.
          exit 0
