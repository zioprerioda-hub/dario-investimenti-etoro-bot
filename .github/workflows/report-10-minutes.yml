name: Report thomaspj every 10 minutes
run-name: "${{ github.event_name }} | thomaspj report"

on:
  workflow_dispatch:
  schedule:
    # UTC, one report every ten minutes; avoid the top of the hour.
    - cron: "6,16,26,36,46,56 * * * *"

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      HTML_REPORT_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      FORCE_HTML_REPORT: "true"
      FORCE_PORTFOLIO_SUMMARY: "true"
      REPORT_URL: ""
      REPORT_DIR: docs
      SEND_INITIAL_PORTFOLIO: "true"
      RISK_FREE_ANNUAL: "0"
      TREEMAP_HISTORY_HOURS: "12"
      TREEMAP_HISTORY_LIMIT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show scheduler mode
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "FORCE_HTML_REPORT=$FORCE_HTML_REPORT"
          echo "FORCE_PORTFOLIO_SUMMARY=$FORCE_PORTFOLIO_SUMMARY"

      - name: Monitor eToro and deliver report when scheduled
        run: python scheduled_runner.py

      - name: Persist monitor and report history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f html_report_state.json ]; then
            git add html_report_state.json
          fi
          if [ -f dashboard_state.json ]; then
            git add dashboard_state.json
          fi
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "chore: update thomaspj monitor state [skip ci]"
          # Integrate changes made while the report was running without force-pushing.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push
