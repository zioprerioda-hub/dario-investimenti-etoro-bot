name: Monitor thomaspj on eToro

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      HTML_REPORT_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      FORCE_HTML_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
      REPORT_URL: ""
      REPORT_DIR: docs
      SEND_INITIAL_PORTFOLIO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor eToro and build portfolio state
        run: python monitor.py

      - name: Restore detailed HTML report engine
        run: |
          python - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          parts = sorted(Path("report_engine_parts").glob("part_*.b64"))
          if len(parts) != 5:
              raise SystemExit(f"Expected 5 report engine parts, found {len(parts)}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          target = Path("report_engine.py")
          target.write_bytes(lzma.decompress(base64.b64decode(encoded)))
          print(f"Restored {target} from {len(parts)} verified parts ({target.stat().st_size} bytes)")
          PY

      - name: Send detailed HTML report to Telegram
        run: python report_engine.py

      - name: Persist monitor and report history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f html_report_state.json ]; then
            git add html_report_state.json
          fi
          if [ -f dashboard_state.json ]; then
            git add dashboard_state.json
          fi
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "chore: update thomaspj monitor state [skip ci]"
          git push
