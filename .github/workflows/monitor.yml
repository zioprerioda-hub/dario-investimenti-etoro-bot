name: Monitor thomaspj on eToro

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      HTML_REPORT_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      FORCE_HTML_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
      REPORT_URL: ""
      REPORT_DIR: docs
      SEND_INITIAL_PORTFOLIO: "true"
      RISK_FREE_ANNUAL: "0"
      TREEMAP_HISTORY_HOURS: "12"
      TREEMAP_HISTORY_LIMIT: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor eToro and build portfolio state
        run: python monitor.py

      - name: Restore corrected HTML report engine
        run: |
          python - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          parts = sorted(Path("report_engine_parts").glob("part_*.b64"))
          if len(parts) != 7:
              raise SystemExit(f"Expected 7 report engine parts, found {len(parts)}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          target = Path("report_engine.py")
          target.write_bytes(lzma.decompress(base64.b64decode(encoded)))
          print(f"Restored {target} from {len(parts)} verified parts ({target.stat().st_size} bytes)")
          PY

      - name: Repair detailed BullAware HTML template
        run: |
          python - <<'PY'
          from pathlib import Path

          patch = Path("template_patch")
          target = Path("template_parts")
          for n in (6, 7, 8):
              pieces = [patch / f"t{n:02d}_0.b64", patch / f"t{n:02d}_1.b64"]
              if not all(p.exists() for p in pieces):
                  raise SystemExit(f"Missing template patch for chunk {n:02d}")
              content = "".join(p.read_text(encoding="ascii").strip() for p in pieces)
              if len(content) != 10800:
                  raise SystemExit(f"Invalid template chunk {n:02d}: {len(content)} bytes")
              (target / f"bullaware_template_{n:02d}.b64").write_text(content, encoding="ascii")
              print(f"Repaired template chunk {n:02d}")
          PY

      - name: Validate detailed report assets
        run: |
          python -m py_compile report_engine.py
          python -m py_compile run_report_fixed.py
          python -m py_compile run_report_ranges.py
          python -m py_compile run_report_ranges_fixed.py
          python - <<'PY'
          import base64
          import lzma
          from pathlib import Path

          source = Path("report_engine.py").read_text(encoding="utf-8")
          engine_required = [
              "def performance_metrics(",
              "RISK_FREE_ANNUAL",
              "TREEMAP_HISTORY_HOURS",
              "TREEMAP_HISTORY_LIMIT",
              "treemap_market_snapshot",
              "TREEMAP_TIME_LABELS",
              "TREEMAP_SIZE_LABELS",
              "Unrealized Returns",
              "Weighted Change",
              "P/E Ratio",
          ]
          missing_engine = [item for item in engine_required if item not in source]
          if missing_engine:
              raise SystemExit(f"Corrected report engine validation failed. Missing: {missing_engine}")

          ranges = Path("run_report_ranges.py").read_text(encoding="utf-8")
          range_required = [
              "Year to date", "Last Year", "Last 2 Years", "Last 3 Years",
              "Last 5 Years", "All Time", "performanceMetricsByPeriod"
          ]
          missing_ranges = [item for item in range_required if item not in ranges]
          if missing_ranges:
              raise SystemExit(f"Performance range validation failed. Missing: {missing_ranges}")

          wrapper = Path("run_report_ranges_fixed.py").read_text(encoding="utf-8")
          if "_ORIGINAL_DEDUPE_FIX = base._fix_html" not in wrapper:
              raise SystemExit("Range wrapper does not preserve original dedupe function")

          parts = sorted(Path("template_parts").glob("bullaware_template_*.b64"))
          if len(parts) != 12:
              raise SystemExit(f"Expected 12 template chunks, found {len(parts)}")
          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          template = lzma.decompress(base64.b64decode(encoded)).decode("utf-8")
          required = [
              'data-tab="overview"', 'data-tab="trades"', 'data-tab="seasonality"',
              'data-tab="history"', 'data-tab="correlations"', 'data-tab="risk"',
              'data-tab="activity"', 'data-tab="dividends"', 'data-tab="positions"',
              'data-tab="copiersTab"', 'data-tab="feed"', 'const D = '
          ]
          missing = [item for item in required if item not in template]
          if missing:
              raise SystemExit(f"Detailed template validation failed. Missing: {missing}")
          print(f"Corrected report engine OK: {len(source)} characters")
          print(f"Detailed BullAware template OK: {len(template)} characters")
          PY

      - name: Send range-aware deduplicated HTML report to Telegram
        run: python run_report_ranges_fixed.py

      - name: Persist monitor and report history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f html_report_state.json ]; then
            git add html_report_state.json
          fi
          if [ -f dashboard_state.json ]; then
            git add dashboard_state.json
          fi
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "chore: update thomaspj monitor state [skip ci]"
          git push
