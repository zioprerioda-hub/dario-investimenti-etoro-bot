name: Monitor thomaspj on eToro

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: thomaspj-etoro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ETORO_USERNAME: thomaspj
      PORTFOLIO_EUR: ${{ vars.PORTFOLIO_EUR || '5000' }}
      MIN_ALERT_EUR: ${{ vars.MIN_ALERT_EUR || '5' }}
      PORTFOLIO_SUMMARY_MINUTES: ${{ vars.PORTFOLIO_SUMMARY_MINUTES || '10' }}
      SEND_INITIAL_PORTFOLIO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor eToro and notify Telegram
        run: python monitor.py

      - name: Persist monitor state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update thomaspj monitor state [skip ci]"
          git push
